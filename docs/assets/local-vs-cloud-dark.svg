<text x="440" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9198a1" text-anchor="middle" font-style="italic">vs</text>
