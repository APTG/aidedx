<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="Where inference runs: a typical cloud AI round-trips every question between your device and company servers, while aidedx downloads the model weights and web app to your device just once and then answers everything there, offline, with nothing sent back" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where inference runs: a typical cloud AI round-trips every question between your device and company servers, while aidedx downloads the model weights and web app to your device just once and then answers everything there, offline, with nothing sent back</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/>
  </marker>
  <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6ca6ff"/>
  </marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
  </marker>
  <marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
  </marker>
</defs>
<rect x="30" y="42" width="143.04" height="26" rx="13" fill="#2b230f" stroke="#5c4a1e" stroke-width="1"/><text x="42" y="59.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d29922" text-anchor="start" letter-spacing="0.4">TYPICAL CLOUD AI</text>
<rect x="24" y="84" width="396" height="76" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="42" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="0.6">THE CLOUD</text>
<g transform="translate(40,114) scale(1.6)" fill="none" stroke="#9198a1" stroke-width="1.0625" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15 a3.5 3.5 0 0 1-0.3-6.98 A4.5 4.5 0 0 1 14.5 8.2 A3.2 3.2 0 0 1 14.5 15 Z"/></g>
