<rect x="24" y="204" width="396" height="84" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="42" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="0.6">YOUR DEVICE</text>
<g transform="translate(40,234) scale(1.6)" fill="none" stroke="#e6edf3" stroke-width="1.0625" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="10" rx="1.4"/><path d="M7 16.5 h6 M10 13.5 v3"/></g>
