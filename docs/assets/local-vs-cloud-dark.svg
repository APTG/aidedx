<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="Where inference runs: typical cloud AI sends your words to company servers; aidedx keeps everything in your browser tab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where inference runs: typical cloud AI sends your words to company servers; aidedx keeps everything in your browser tab</title>
