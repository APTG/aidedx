<g transform="translate(46,316) scale(1)" fill="none" stroke="#d29922" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="13" height="5" rx="1.2"/><rect x="3.5" y="11" width="13" height="5" rx="1.2"/><path d="M6 6.5 h0.01 M6 13.5 h0.01"/></g>
