<text x="506" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-style="italic">Everything stays inside this box</text>
<g transform="translate(482,282) scale(1)" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="12" height="8" rx="1.6"/><path d="M6.5 9 V6.5 a3.5 3.5 0 0 1 7 0 V9"/><circle cx="10" cy="13" r="1" fill="#3fb950"/></g>
<text x="512" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Your questions never touch the network</text>
<g transform="translate(482,316) scale(1)" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 L8.5 15 L16 6"/></g>
<text x="512" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Just a static file — free to host, nothing to run</text>
<g transform="translate(482,350) scale(1)" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5 a10 10 0 0 1 15 0 M5.5 11.2 a6 6 0 0 1 9 0 M8.2 13.9 a2.4 2.4 0 0 1 3.6 0 M3 3 L17 17"/></g>
<text x="512" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Works offline once the models are cached</text>
