<text x="504" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Just a static file — free to host, nothing to run</text>
<g transform="translate(474,342) scale(1)" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5 a10 10 0 0 1 15 0 M5.5 11.2 a6 6 0 0 1 9 0 M8.2 13.9 a2.4 2.4 0 0 1 3.6 0 M3 3 L17 17"/></g>
<text x="504" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Works offline once the models are cached</text>
