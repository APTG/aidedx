<rect x="460" y="84" width="396" height="76" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="478" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="0.6">STATIC HOSTING</text>
<g transform="translate(476,114) scale(1.6)" fill="none" stroke="#9198a1" stroke-width="1.0625" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15 a3.5 3.5 0 0 1-0.3-6.98 A4.5 4.5 0 0 1 14.5 8.2 A3.2 3.2 0 0 1 14.5 15 Z"/></g>
<text x="518" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">GitHub Pages</text>
<text x="518" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">a static web app</text>
<rect x="460" y="204" width="396" height="84" rx="14" fill="#12233d" stroke="#6ca6ff" stroke-width="2"/>
<text x="478" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9fc5ff" text-anchor="start" letter-spacing="0.6">YOUR DEVICE</text>
<g transform="translate(476,234) scale(1.6)" fill="none" stroke="#e6edf3" stroke-width="1.0625" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="10" rx="1.4"/><path d="M7 16.5 h6 M10 13.5 v3"/></g>
<text x="518" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Everything runs here</text>
<text x="518" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">question → answer, fully offline</text>
<g transform="translate(818,230) scale(1.1)" fill="none" stroke="#3fb950" stroke-width="1.5454545454545452" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="12" height="8" rx="1.6"/><path d="M6.5 9 V6.5 a3.5 3.5 0 0 1 7 0 V9"/><circle cx="10" cy="13" r="1" fill="#3fb950"/></g>
