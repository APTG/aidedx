name: Deploy

# Continuous deploy to GitHub Pages, gated on CI passing on main (mirrors dedx_web's
# web_dev continuous deploy). Publishes the static build to the repo's own
# GitHub Pages site at https://aptg.github.io/aidedx/.
#
# Deploys only fire once ci.yml has run to completion on main and succeeded — a push that
# breaks format/lint/typecheck/validate:eval/tests no longer publishes (issue #163 §6.1).
# workflow_dispatch is kept for manual re-deploys without a new push.
#
# ci.yml also runs on pull_request, so workflow_run fires for PR CI too — the build job's `if`
# requires event == 'push' (excludes PR-triggered runs, including a fork PR whose head branch
# happens to be named "main") and head_repository == this repo, so only an actual push to this
# repo's main branch can reach the checkout/build/deploy steps below.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress production runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SvelteKit app
        run: pnpm build
        env:
          # GitHub Pages serves the project site under /aidedx.
          BASE_PATH: /aidedx

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
