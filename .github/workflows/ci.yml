name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Type-check (svelte-check + tsc)
        run: pnpm run check

      - name: Validate eval set (eval/intents.jsonl)
        run: pnpm run validate:eval

      # Reported, non-blocking metric: deterministic NLU coverage over the eval
      # set (issue #5). Surfaces coverage % and the LLM-fallback misses without
      # gating the build — the script always exits 0.
      - name: Deterministic NLU coverage (reported, non-blocking)
        continue-on-error: true
        run: pnpm run coverage:intents

      # Reported, non-blocking metric: end-to-end audio→intent accuracy (issue #27), re-scored
      # from the committed transcript JSONs in eval/results/asr-2026-07-05/ against the frozen
      # eval/intents.jsonl gold labels. No audio or model needed — deterministic and fast — so
      # any matcher/corrector change gets this number on every PR without re-running ASR.
      # continue-on-error (not the script's own exit code) is what keeps this non-blocking — the
      # script itself does throw on a missing/unreadable/malformed transcript JSON. Transcription
      # itself (producing new transcript JSONs) stays local.
      - name: End-to-end audio→intent accuracy (reported, non-blocking)
        continue-on-error: true
        run: pnpm run eval:e2e -- eval/results/asr-2026-07-05/*.json

  build:
    name: Build + Unit Tests
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build SvelteKit app
        run: pnpm build
