# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Action version pins (e.g. actions/checkout@v4) never update on their own (issue #163 §6.2).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The bench/android/* apps (full-app, sherpa-onnx, vosk, wav2vec2, whispercpp) each vendor
  # their own Gradle wrapper + dependencies; none were covered before (issue #163 §6.2).
  - package-ecosystem: "gradle"
    directories:
      - "/bench/android/*"
    schedule:
      interval: "weekly"
    groups:
      # kotlin-gradle-plugin (the compiler) and kotlin-stdlib must move together: a stdlib jar
      # newer than the compiler that reads it fails with "compiled with an incompatible version
      # of Kotlin" (full-app's #188 vs #193 split hit exactly this - stdlib alone bumped to
      # 2.4.10 while the 1.9.24 compiler could only read up to metadata 2.0). Grouping applies
      # per expanded directory, so full-app and sherpa-onnx each get their own single PR instead
      # of two that can land out of order.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
