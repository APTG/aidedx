<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aidedx</title>

    <!--
      Cross-origin isolation (COOP/COEP), permanent (issue #9, decided and measured in
      docs/threading-coop-coep.md). GitHub Pages can't set COOP/COEP headers itself, so
      coi-serviceworker fakes them client-side: crossOriginIsolated becomes true after a
      one-time reload on first visit, which unlocks SharedArrayBuffer and lets transcribe.ts
      set env.backends.onnx.wasm.numThreads explicitly instead of ORT's conservative default.
      Measured effect: whisper-small prefill drops ~2-3x (~8s -> ~3-5s). Using COEP
      `credentialless` so the cross-origin ORT wasm and Cyfronet S3 model mirror keep loading
      without their own CORP headers. Remove this line + static/coi-serviceworker.js only if
      that decision is reversed.
    -->
    <script src="%sveltekit.assets%/coi-serviceworker.js"></script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
