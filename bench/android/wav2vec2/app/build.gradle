apply plugin: 'com.android.application'

android {
    namespace "com.aidedx.wav2vec2bench"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.aidedx.wav2vec2bench"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // onnxruntime-android 1.22.0 pulls both merged kotlin-stdlib (1.8.22+) and the superseded
    // split kotlin-stdlib-jdk7/-jdk8 artifacts (1.6.21) - same duplicate-class conflict seen in
    // the Vosk bench (bench/android/vosk/app/build.gradle).
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
