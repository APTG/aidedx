apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.aidedx.fullapp"
    compileSdkVersion 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.aidedx.fullapp"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Same duplicate-class conflict seen in the other bench apps (vosk/wav2vec2/whispercpp) —
// something in the default AGP/AndroidX dependency graph pulls both the merged kotlin-stdlib
// (1.9.24+) and the superseded split kotlin-stdlib-jdk7/-jdk8 artifacts.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // issue #136 goal 4 — a real (non-Android-stub) org.json so the matcher-vs-TS agreement
    // check (KotlinMatcherAgreementTest, a local JVM unit test — no device/emulator needed) can
    // parse the same static/aliases/*.json the app itself bundles as assets.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
