apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// issue #161 — a field capture needs to record exactly which build produced it (a capture from an
// unknown commit is close to worthless once a few weeks and a few fixes have gone by). Evaluated
// once at configuration time and baked into BuildConfig below, same "ask git, don't guess" spirit
// as `docs/android-full-app-spike.md`'s device-verification convention. `.text.trim()` on a
// process started outside a git repo (or without git on PATH) throws; falls back to a value that
// makes the gap obvious rather than failing the whole build over a diagnostic-only field.
def gitShaOrUnknown() {
    try {
        return "git rev-parse --short HEAD".execute([], project.rootDir).text.trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

def gitIsDirty() {
    try {
        return !"git status --porcelain".execute([], project.rootDir).text.trim().isEmpty()
    } catch (Exception ignored) {
        return false
    }
}

android {
    namespace "com.aidedx.fullapp"
    compileSdkVersion 34
    ndkVersion "28.2.13676358"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.aidedx.fullapp"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        buildConfigField "String", "GIT_SHA", "\"${gitShaOrUnknown()}\""
        buildConfigField "boolean", "GIT_DIRTY", "${gitIsDirty()}"
        buildConfigField "long", "BUILD_TIME_MS", "${System.currentTimeMillis()}L"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Same duplicate-class conflict seen in the other bench apps (vosk/wav2vec2/whispercpp) —
// something in the default AGP/AndroidX dependency graph pulls both the merged kotlin-stdlib
// (1.9.24+) and the superseded split kotlin-stdlib-jdk7/-jdk8 artifacts.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // issue #136 goal 4 — a real (non-Android-stub) org.json so the matcher-vs-TS agreement
    // check (KotlinMatcherAgreementTest, a local JVM unit test — no device/emulator needed) can
    // parse the same static/aliases/*.json the app itself bundles as assets.
    testImplementation 'org.json:json:20260719'
    testImplementation 'junit:junit:4.13.2'
}
