apply plugin: 'com.android.application'

android {
    namespace "com.aidedx.voskbench"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.aidedx.voskbench"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // vosk-android 0.3.75 pulls both merged kotlin-stdlib (1.8.22+) and the superseded
    // split kotlin-stdlib-jdk7/-jdk8 artifacts (1.6.21) whose classes were folded into
    // kotlin-stdlib itself in later Kotlin releases - same classes, duplicate-class build
    // failure otherwise.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
